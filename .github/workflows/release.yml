# INVARIANT: Release pipeline invokes reusable build workflow and verifies attestations before publishing.
name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    uses: ./.github/workflows/_release-build.yml

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: origin-zero-linux-amd64
          path: ./release-artifacts

      - name: Verify Attestation Script
        run: |
          chmod +x tools/verify_attestation.sh
          ./tools/verify_attestation.sh ./release-artifacts/origin-cli

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-artifacts/*
