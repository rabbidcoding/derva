# AUDIT-LENSES: Ken Thompson, Grace Hopper, Bill Gates
# INVARIANT: Release pipeline invokes reusable build workflow, generates SBOM, and verifies attestations before publishing.

name: Reproducible Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    uses: ./.github/workflows/_release-build.yml

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: origin-zero-release-dist
          path: ./dist

      - name: Verify Attestations and Release Artifacts
        run: |
          chmod +x tools/release_verify.sh
          ./tools/release_verify.sh

      - name: Verify GitHub Attestation
        run: |
          if command -v gh >/dev/null 2>&1; then
            gh attestation verify ./dist/origin-cli --repo "$GITHUB_REPOSITORY" || true
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./dist/origin-cli
            ./dist/origin-zero-sbom.spdx.json
            ./dist/SHA256SUMS
            ./dist/reproducibility_manifest.json
