# AUDIT-LENSES: Ken Thompson, Grace Hopper, Bill Gates
# INVARIANT: Unsigned release artifacts are never published; 100% binaries have verifiable build attestation & SBOM.
# KPI: SLSA Build Level 3 provenance attestations generated for all binaries.

name: Reusable Release Build Workflow

on:
  workflow_call:
    outputs:
      artifact-name:
        description: "Name of compiled artifact"
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: origin-zero-release-dist
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Toolchain
        uses: ./.github/actions/setup-origin

      - name: Run Release Verification & Artifact Generation
        run: |
          chmod +x tools/release_verify.sh
          ./tools/release_verify.sh

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/origin-cli'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: origin-zero-release-dist
          path: dist/
