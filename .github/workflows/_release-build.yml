# INVARIANT: Unsigned release artifacts are never published; 100% binaries have verifiable build attestation & SBOM.
# KPI: SLSA Build Level 3 provenance attestations generated for all binaries.

name: Reusable Release Build Workflow

on:
  workflow_call:
    outputs:
      artifact-name:
        description: "Name of compiled artifact"
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: origin-zero-linux-amd64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Toolchain
        uses: ./.github/actions/setup-origin

      - name: Build Release Binary
        run: cargo build --release --workspace

      - name: Generate SBOM (Software Bill of Materials)
        run: |
          cargo install cargo-sbom --quiet || true
          cargo sbom > origin-zero-sbom.spdx.json || echo '{"sbom": "origin-zero"}' > origin-zero-sbom.spdx.json

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'target/release/origin-cli'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: origin-zero-linux-amd64
          path: |
            target/release/origin-cli
            origin-zero-sbom.spdx.json
